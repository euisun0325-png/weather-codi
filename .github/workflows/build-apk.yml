name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WeatherCodi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WeatherCodi-apk
          path: WeatherCodi.apk
      - name: Publish to Releases (휴대폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 날씨코디 빌드 ${{ github.run_number }}
          files: WeatherCodi.apk
