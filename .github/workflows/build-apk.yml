name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            msg=$(grep -E "^e: |error:|What went wrong|Could not" -A2 build.log | sed 's#file:///home/runner/work/weather-codi/weather-codi/##' | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error::$msg"
            exit 1
          }
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WeatherCodi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WeatherCodi-apk
          path: WeatherCodi.apk
      - name: Publish to Releases (휴대폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 날씨코디 빌드 ${{ github.run_number }}
          files: WeatherCodi.apk
